<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171615" media="(prefers-color-scheme: dark)">
<title>lifeboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@900&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#faf6ec; --surface:#fffcf6; --sunk:#f1eadb; --line:rgba(40,28,10,.09);
  --text:#16130d; --muted:#6b6152; --faint:#928672;
  --accent:#de5506; --fill:#c44a04; --ink:#b33f02; --on:#fff;
  --shadow:0 1px 2px rgba(70,45,10,.05),0 6px 20px rgba(70,45,10,.05);
  --lift:0 10px 30px rgba(70,45,10,.18);
  --blur:rgba(250,246,236,.86);
  --cal-a:#5f6f8f; --cal-b:#5f8458; --cal-c:#8c5e7e;
  --raise:var(--surface); --panel:var(--surface); --hot:#fbe3cb; --line2:rgba(40,28,10,.16); --pop:0 14px 34px rgba(70,45,10,.3); --scrim:rgba(20,14,6,.4);
  --bad:#a8221b; --good:#2f6b4f; --tbtn:#ffb27a; --soft:var(--muted); --barh:46px; --gut:16px;
  --stick:calc(env(safe-area-inset-top) + var(--barh));
  --r:20px; --tabh:62px;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Fraunces",Georgia,serif;
  /* area tints: --t-* is the wash, --a-* the mark drawn on it (3:1+). Wayfinding only, never an action color. */
  --t-today:#fbe3cb; --a-today:#c24a04;
  --t-plan:#d6e6ef;  --a-plan:#2a6a90;
  --t-lists:#f6e7ae; --a-lists:#8a6a00;
  --t-health:#f4d7cd; --a-health:#b0412a;
  --t-money:#e4dbf1; --a-money:#6f4a9f;
  --t-home:#d2e7df;  --a-home:#27705e;
  --t-hobbies:#cde3ee; --a-hobbies:#1d6784;
  --t-habits:#dfe9d0; --a-habits:#46722f;
  --t-goals:#ecd6c1; --a-goals:#8f5224;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#171615; --surface:#21201e; --sunk:#2c2b28; --line:rgba(255,255,255,.08);
    --text:#f1eee9; --muted:#adaaa3; --faint:#77746e;
    --accent:#ff7f36; --fill:#ff7f36; --ink:#ffa774; --on:#171615;
    --raise:var(--surface); --panel:var(--surface); --hot:rgba(255,127,54,.15); --line2:rgba(255,255,255,.15); --pop:0 14px 34px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
    --bad:#ff9d8f; --good:#8fd4b0; --tbtn:#b33f02; --soft:var(--muted);
    --shadow:0 1px 2px rgba(0,0,0,.3); --lift:0 10px 30px rgba(0,0,0,.5);
    --blur:rgba(23,22,21,.86);
    --cal-a:#93a3c4; --cal-b:#93b88b; --cal-c:#c497b6;
    --t-today:#42281a; --a-today:#ff9a62;
    --t-plan:#1d2f3b;  --a-plan:#86c6ee;
    --t-lists:#38310f; --a-lists:#ecce62;
    --t-health:#3b241d; --a-health:#f5a38b;
    --t-money:#2e2540; --a-money:#c9aaf2;
    --t-home:#1b3129;  --a-home:#7fd8be;
    --t-hobbies:#1a2f3d; --a-hobbies:#72c9ee;
    --t-habits:#27321f; --a-habits:#a5d68a;
    --t-goals:#382a1c; --a-goals:#e6ae7a;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#171615; --surface:#21201e; --sunk:#2c2b28; --line:rgba(255,255,255,.08);
  --text:#f1eee9; --muted:#adaaa3; --faint:#77746e;
  --accent:#ff7f36; --fill:#ff7f36; --ink:#ffa774; --on:#171615;
  --raise:var(--surface); --panel:var(--surface); --hot:rgba(255,127,54,.15); --line2:rgba(255,255,255,.15); --pop:0 14px 34px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
    --bad:#ff9d8f; --good:#8fd4b0; --tbtn:#b33f02; --soft:var(--muted);
  --shadow:0 1px 2px rgba(0,0,0,.3); --lift:0 10px 30px rgba(0,0,0,.5);
  --blur:rgba(23,22,21,.86);
  --cal-a:#93a3c4; --cal-b:#93b88b; --cal-c:#c497b6;
  --t-today:#42281a; --a-today:#ff9a62;
  --t-plan:#1d2f3b;  --a-plan:#86c6ee;
  --t-lists:#38310f; --a-lists:#ecce62;
  --t-health:#3b241d; --a-health:#f5a38b;
  --t-money:#2e2540; --a-money:#c9aaf2;
  --t-home:#1b3129;  --a-home:#7fd8be;
  --t-hobbies:#1a2f3d; --a-hobbies:#72c9ee;
  --t-habits:#27321f; --a-habits:#a5d68a;
  --t-goals:#382a1c; --a-goals:#e6ae7a;
}
.k-today{--t:var(--t-today);--a:var(--a-today)}
.k-plan{--t:var(--t-plan);--a:var(--a-plan)}
.k-lists{--t:var(--t-lists);--a:var(--a-lists)}
.k-health{--t:var(--t-health);--a:var(--a-health)}
.k-money{--t:var(--t-money);--a:var(--a-money)}
.k-home{--t:var(--t-home);--a:var(--a-home)}
.k-hobbies{--t:var(--t-hobbies);--a:var(--a-hobbies)}
.k-habits{--t:var(--t-habits);--a:var(--a-habits)}
.k-goals{--t:var(--t-goals);--a:var(--a-goals)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--stick) + 44px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15.5px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.card :focus-visible,.nowcard :focus-visible{outline-offset:-3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:var(--s,22px);height:var(--s,22px);flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}

/* ---------- shell ---------- */
.app{max-width:820px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 2px) max(var(--gut),env(safe-area-inset-right)) calc(var(--tabh) + 84px + env(safe-area-inset-bottom)) max(var(--gut),env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px}
.wordmark{font:900 clamp(42px,10vw,58px)/1 "Hanken Grotesk",var(--sans);letter-spacing:-.045em;margin:0;text-transform:lowercase;color:var(--text)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--soft);flex:none}
.iconbtn:hover{background:var(--sunk);color:var(--text)}
/* collapsed header: the wordmark shrinks into this slim bar, which carries the day summary */
.bar{position:fixed;inset:0 0 auto 0;z-index:30;padding:env(safe-area-inset-top) max(var(--gut),env(safe-area-inset-right)) 0 max(var(--gut),env(safe-area-inset-left));background:var(--blur);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);box-shadow:0 1px 0 var(--line);transform:translateY(-110%);transition:transform .2s ease}
.bar.show{transform:none}
.bar-in{max-width:820px;margin:0 auto;height:var(--barh);display:flex;align-items:center;gap:10px}
.bar-wm{font:900 22px/1 "Hanken Grotesk",var(--sans);letter-spacing:-.045em;text-transform:lowercase;flex:none;margin:0;padding-right:10px;border-right:1px solid var(--line2)}
.bar-t{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t .hotc{color:var(--ink)}
.bar .iconbtn{margin-right:-8px}
.daystrip{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin:0 0 6px;font-size:14px;color:var(--soft);min-height:26px}
.daystrip .d{font-weight:700;color:var(--text)}
.daystrip .sep{color:var(--muted)}
.daystrip .hotc{font-weight:700;color:var(--ink)}
.daystrip .hotc.late{color:var(--bad)}
.greet{display:none;font:italic 500 18px/1.2 var(--display);color:var(--text)}
.phead{display:flex;align-items:center;gap:10px;margin:2px 0 8px;min-height:40px}
.aico{width:34px;height:34px;border-radius:11px;background:var(--t);color:var(--a);display:grid;place-items:center;flex:none}
.ltitle{font:600 25px/1.1 var(--display);letter-spacing:-.015em;margin:0}
.psub{display:none;color:var(--muted);font-size:14px;margin:0}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--blur);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);box-shadow:0 -1px 0 var(--line);padding:0 max(2px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(2px,env(safe-area-inset-left))}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{min-height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.01em}
.tab .pill{width:50px;height:28px;border-radius:14px;display:grid;place-items:center;transition:background .2s}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"] .pill{background:var(--t,var(--hot));color:var(--a,var(--ink))}
.fab{position:fixed;z-index:41;right:max(16px,calc(env(safe-area-inset-right) + 16px));bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom));height:56px;min-width:56px;border-radius:28px;background:var(--fill);color:var(--on);display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--pop);font-weight:700;padding:0 16px;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab .lbl{display:none}

/* ---------- surfaces: tier 1 raised, tier 2 panel, tier 3 sunken ---------- */
.sec{margin-top:14px}
.sec-h{position:sticky;top:var(--stick);z-index:6;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;margin:0 0 3px;padding:0 2px;background:var(--bg)}
.sec-t{display:flex;align-items:center;gap:8px;font:700 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:0}
.sec-t .tm{width:4px;height:15px;border-radius:2px;background:var(--faint);flex:none}
.sec-t .ct{font-weight:600;letter-spacing:0;font-size:13px;color:var(--muted)}
.sec-t .lt{font-weight:700;letter-spacing:.02em;text-transform:none;font-size:12.5px;color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);padding:2px 7px;border-radius:999px}
.t1 .sec-t{color:var(--ink)} .t1 .tm{background:var(--fill)}
.t2 .tm{background:var(--accent);opacity:.55}
.t3 .sec-t{color:var(--muted);font-weight:600}
.link{min-width:44px;justify-content:center;color:var(--ink);font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:2px;padding:0 4px}
.sec-h .link{margin:-6px -4px -6px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:1px 10px;overflow:hidden}
.card:has(.dragging){overflow:visible}
.card.pad{padding:12px 6px}
.t1 .card{background:var(--raise);box-shadow:var(--lift)}
.t3 .card{background:color-mix(in srgb,var(--sunk) 42%,transparent);border-color:transparent;box-shadow:none}
.group-l{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin:12px 2px 4px;display:flex;align-items:center;gap:8px;break-after:avoid}
.group-l .ct{font-weight:600;color:var(--muted);letter-spacing:0;font-size:12.5px}
.group-l.hot{color:var(--ink)}
.empty{color:var(--muted);padding:10px 0;margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--soft);white-space:nowrap}
.chip.hot{background:var(--hot);color:var(--ink)}
.btn{min-height:44px;padding:0 15px;border-radius:10px;background:var(--sunk);color:var(--text);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative}
.btn.primary{background:var(--fill);color:var(--on)}
.btn.ghost{background:none;color:var(--ink);padding:0 10px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:9px}
.btn.sm::after{content:"";position:absolute;inset:-4px -2px}
.btn[disabled]{opacity:.45;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--gut) * -1);padding:2px var(--gut) 4px;scroll-snap-type:x proximity}
.scroller::-webkit-scrollbar{display:none}
.seg{min-height:44px;padding:0 14px;border-radius:22px;background:var(--sunk);color:var(--soft);font-weight:600;font-size:14.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none;scroll-snap-align:start}
.seg[aria-pressed="true"],.seg[aria-selected="true"]{background:var(--text);color:var(--bg)}
.seg .ct{font-weight:500;opacity:.8;font-size:13px}
.seg.sub[aria-selected="true"],.kinds button.sub[aria-selected="true"]{background:var(--t);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--a)}
.seg.sub[aria-selected="true"] svg.i,.kinds button.sub[aria-selected="true"] svg.i{color:var(--a)}
.bar-meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar-meter>i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* ---------- task rows ---------- */
.list{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:44px 1fr 44px;align-items:start;column-gap:2px;padding:0;position:relative;background:inherit;transition:opacity .2s,transform .2s}
.task:not(.nogrip){grid-template-columns:44px 1fr 44px 44px}
.list>li+li{box-shadow:inset 0 1px 0 var(--line)}
.list>li+li.task{box-shadow:none}
.list>li+li.task::before{content:"";position:absolute;top:0;left:46px;right:0;height:1px;background:var(--line)}
.task.late::after{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:var(--bad)}
.tick{width:44px;min-width:44px;flex:none;height:44px;display:grid;place-items:center;border-radius:50%}
.tick .ring{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--faint);display:grid;place-items:center;color:transparent;transition:background .15s,box-shadow .15s}
.tick:hover .ring{box-shadow:inset 0 0 0 2px var(--accent)}
.task.done .tick .ring,.tick[aria-pressed="true"] .ring{background:var(--fill);box-shadow:none;color:var(--on)}
.task.leaving{opacity:0;transform:translateX(24px)}
.tmain{min-width:0;text-align:left;padding:6px 0 5px;min-height:44px;display:block;width:100%}
.ttl{display:block;font-weight:600;font-size:15.5px;line-height:1.28;overflow-wrap:anywhere}
.ttl svg.i{vertical-align:-3px;color:var(--muted)}
.task.done .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:1px 9px;margin-top:1px;font-size:12.5px;color:var(--muted)}
.tmeta .m{display:inline-flex;align-items:center;gap:3px}
.tmeta .hot{color:var(--ink);font-weight:700}
.tmeta .bad{color:var(--bad);font-weight:700}
.tmeta svg.i{--s:13px}
.act{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.act:hover{background:var(--sunk);color:var(--text)}
.grip{cursor:grab;touch-action:none;color:var(--muted);width:44px;-webkit-user-select:none;user-select:none}
.grip:active{color:var(--text);background:var(--sunk)}
.sortc{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
.sortc select{width:auto;min-height:44px;font-size:14.5px;font-weight:600;padding:0 30px 0 12px;border-radius:22px;background-color:var(--sunk);box-shadow:none;color:var(--soft)}
.task.dragging{z-index:5;box-shadow:var(--lift);border-radius:10px;transition:none;opacity:.97;background:var(--raise)}
.tray{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px}
.notes{grid-column:2 / -1;margin:0 0 6px;font-size:14px;color:var(--soft);white-space:pre-wrap}

/* ---------- today ---------- */
.today{display:flex;flex-direction:column}
.today>.col{display:contents}
.z-now{order:1}.z-due{order:2}.z-sched{order:3}.z-week{order:4}.z-more{order:5}.z-amb{order:6}.z-hab{order:7}
.cond{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;text-align:left;padding:9px 10px 8px}
.cond .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.cond .v{font:600 18px/1.2 var(--display);display:block;margin-top:1px;white-space:nowrap}
.cond .s{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wedrow{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin-top:6px;padding:3px 10px 3px 4px;border-radius:var(--r);background:color-mix(in srgb,var(--sunk) 42%,transparent);font-size:14px;color:var(--soft);text-align:left}
.wedrow b{font:600 17px/1 var(--display);background:var(--fill);color:var(--on);border-radius:999px;min-width:34px;height:34px;display:grid;place-items:center;padding:0 8px;flex:none}
.wedrow span{flex:1;min-width:0}
.ev{display:grid;grid-template-columns:62px 4px 1fr;column-gap:10px;align-items:start;padding:7px 0}
.ev .t{white-space:nowrap;font-size:13.5px;font-weight:600;text-align:right;line-height:1.25}
.ev .t span{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ev .bar-c{align-self:stretch;border-radius:2px;background:var(--c,var(--accent));min-height:30px}
.ev .et{font-weight:600;line-height:1.28;overflow-wrap:anywhere;font-size:15px}
.ev .es{font-size:12.5px;color:var(--muted)}
.ev.past{opacity:.55;padding:3px 0}
.ev.past .bar-c{min-height:20px}
.ev.past .es{display:none}
.ev.now .bar-c{background:var(--fill);box-shadow:0 0 0 3px var(--hot)}
/* free time takes room in proportion to its length; past gaps collapse */
.gap{display:grid;grid-template-columns:62px 4px 1fr;column-gap:10px;align-items:center;min-height:var(--h,30px);padding:0;color:var(--muted);font-size:13px}
.gap .bar-c{align-self:stretch;border-left:2px dotted var(--faint);margin-left:1px}
.gap .gl{font:italic 500 14.5px/1.3 var(--display)}
.gap .gl b{font:600 13.5px var(--sans);font-style:normal;color:var(--soft)}
.gap.past{min-height:8px;opacity:.5}
.gap.past .gl{display:none}
.nowline{display:grid;grid-template-columns:62px 4px 1fr;column-gap:10px;align-items:center;min-height:22px;position:relative}
.nowline .t{font-size:12px;font-weight:700;color:var(--ink);text-align:right;line-height:1}
.nowline .dot{width:11px;height:11px;border-radius:50%;background:var(--fill);margin-left:-3.5px;box-shadow:0 0 0 3px var(--panel)}
.nowline .ln{height:2px;border-radius:1px;background:var(--fill);position:relative;margin-left:-12px}
.allday{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px}
.adchip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:8px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--text);box-shadow:inset 3px 0 0 var(--c)}
.hl{list-style:none;margin:0;padding:0}
.hl li{display:grid;grid-template-columns:1fr auto 44px;align-items:center;column-gap:6px;min-height:50px}
.hl li+li{box-shadow:inset 0 1px 0 color-mix(in srgb,var(--line) 70%,transparent)}
.hl .hn{display:flex;align-items:center;gap:10px;min-width:0}
.hl .hi{color:var(--muted);display:grid;place-items:center;flex:none}
.hl .hnn{display:flex;flex-direction:column;min-width:0;gap:3px}
.hl .nm{font-weight:600;font-size:14.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl .hs{display:flex;align-items:center;gap:8px;min-height:14px}
.hl .hs small{font-weight:600;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:2px}
.hl .hs small svg.i{--s:13px;color:var(--accent)}
.hl .hc{font-size:15px;font-weight:700;color:var(--soft)}
.hl .hc small{font-weight:500;color:var(--muted);font-size:12.5px}
.dots{display:flex;gap:3px}
.dots i{height:5px;width:12px;border-radius:3px;background:var(--sunk)}
.dots i.on{background:var(--accent)}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{min-height:44px;padding:0 12px 0 14px;border-radius:22px;background:color-mix(in srgb,var(--sunk) 70%,transparent);color:var(--soft);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:5px}
.dchip .num{color:var(--muted);font-weight:600}
.dchip[aria-expanded="true"]{background:var(--text);color:var(--bg)}
.dchip[aria-expanded="true"] .num{color:var(--bg);opacity:.8}
.logbtn{width:44px;height:44px;border-radius:50%;color:var(--ink);display:grid;place-items:center}
.logbtn span{width:30px;height:30px;border-radius:50%;background:var(--hot);display:grid;place-items:center}
.quote{margin:22px 4px 0;text-align:center;color:var(--muted)}
.quote p{font:italic 500 16px/1.4 var(--display);margin:0 auto;max-width:36ch;color:var(--soft)}
.quote .by{font-size:13px;margin-top:2px}

/* ---------- Now card: the single next best thing ---------- */
.nowcard{margin-top:6px;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift);padding:10px 12px 10px 15px;position:relative;overflow:hidden}
.nowcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--fill)}
.nowcard .eb{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.nowcard .eb>span{display:inline-flex;align-items:center;gap:7px}
.nowcard .eb i{width:8px;height:8px;border-radius:50%;background:var(--fill);box-shadow:0 0 0 3px var(--hot);animation:nowpulse 2.4s ease-in-out infinite}
.nowcard .eb .pos{color:var(--muted);letter-spacing:.02em;font-weight:600;text-transform:none;font-size:12.5px}
@keyframes nowpulse{50%{box-shadow:0 0 0 5px var(--hot)}}
.nowcard h3{font:600 clamp(20px,5.4vw,23px)/1.15 var(--display);letter-spacing:-.012em;margin:6px 0 2px;overflow-wrap:anywhere;display:flex;align-items:flex-start;gap:7px}
.nowcard h3 svg.i{margin-top:3px;color:var(--muted)}
.nowcard .why{margin:0;color:var(--muted);font-size:13.5px}
.nowcard .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nowcard .acts .btn.primary{min-width:96px}
.nowcard.clear{box-shadow:var(--shadow);background:var(--panel)}
.nowcard.clear::before{background:var(--faint)}

/* ---------- quick add (inside the add sheet) ---------- */
.qfield input{font-size:17px;min-height:54px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:26px}
.pchips .chip svg.i{--s:14px}
.pchips .chip.kind{background:var(--hot);color:var(--ink)}
.qhint{margin:8px 2px 0;font-size:13.5px;color:var(--muted)}
details.more{margin-top:14px;border-top:1px solid var(--line)}
details.more>summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary svg.i{transition:transform .2s}
details.more[open]>summary svg.i{transform:rotate(90deg)}

/* ---------- calendar ---------- */
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0}
.cal-h h3{font:600 19px/1 var(--display);margin:0}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:0;text-align:center}
.wdh{font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0;letter-spacing:.04em}
.day{min-height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:15px}
.day.out{color:var(--muted);font-weight:400;opacity:.75}
.day.today{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.day[aria-pressed="true"]{background:var(--text);color:var(--bg);box-shadow:none}
.day .dd{display:flex;gap:2px;height:5px}
.day .dd i{width:5px;height:5px;border-radius:50%;background:var(--c,var(--faint))}

/* ---------- lists ---------- */
.item{display:grid;grid-template-columns:44px 1fr auto;align-items:center;column-gap:2px;min-height:48px;padding:0}
.item .tmain{padding:5px 0}
.item.done .ttl{color:var(--muted);text-decoration:line-through}
.qa{display:flex;gap:8px;margin:0 0 8px}
.qa input{flex:1;min-width:0}
.timer-bar{height:4px;border-radius:2px;background:var(--sunk);margin-top:5px;overflow:hidden;max-width:180px}
.timer-bar i{display:block;height:100%;background:var(--accent)}
.recipe{padding:10px 0}
.recipe+.recipe{border-top:1px solid var(--line)}
.recipe h4{margin:0;font-size:16px}
.lsplit{display:block}

/* ---------- life ---------- */
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.timer{font:600 56px/1 var(--display);text-align:center;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.callout{background:var(--sunk);border-radius:10px;padding:12px 14px;margin-top:8px;font-size:15px;color:var(--text)}
.wx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{font:600 36px/1 var(--display)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14.5px}
.kv+.kv{border-top:1px solid var(--line)}
.wcard{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.wcard .stat{grid-row:1 / 3;color:var(--ink)}
.flow>.sec:first-child{margin-top:8px}

/* ---------- grow ---------- */
.hcard{padding:12px}
.hcard+.hcard{margin-top:10px}
.hhead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.hicon{width:40px;height:40px;border-radius:11px;background:var(--hot);color:var(--ink);display:grid;place-items:center}
.hhead h3{margin:0;font-size:17px}
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:10px 0 4px}
.weeks i{aspect-ratio:1;border-radius:4px;background:var(--sunk);display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700;color:var(--soft)}
.weeks i.floor{background:var(--hot);color:var(--ink)}
.weeks i.hit{background:var(--fill);color:var(--on)}
.weeks i.cur{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--text)}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;text-align:center}
.counts b{display:block;font:600 20px/1.1 var(--display)}
.counts span{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--sunk)}
.legend i.floor{background:var(--hot);box-shadow:inset 0 0 0 1px var(--accent)}
.legend i.hit{background:var(--fill)}
.goal{padding:12px}
.goal+.goal{margin-top:10px}
.goal h3{margin:0;font-size:17px;line-height:1.25}
.goal.complete h3{color:var(--muted)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.qcell{background:var(--sunk);border-radius:10px;padding:8px 10px;text-align:left;min-height:68px;display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.35;color:var(--text)}
.qcell .q{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);display:flex;justify-content:space-between}
.qcell.now{background:var(--hot);box-shadow:inset 0 0 0 1.5px var(--accent)}
.qcell.now .q{color:var(--ink)}
.qcell .ph{color:var(--muted);font-style:italic}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:92dvh;background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:var(--pop);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:620px;margin:0 auto}
.sheet.open{transform:none}
.sheet[hidden]{display:none}
main:focus{outline:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--faint);opacity:.5;margin:8px auto 0}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 2px 18px}
.sh-h h2{font:600 21px/1.2 var(--display);margin:0}
.sh-b{flex:1 1 auto;min-height:0;overflow-y:auto;padding:2px 18px 10px;overscroll-behavior:contain}
.sh-f{padding:10px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;box-shadow:0 -1px 0 var(--line)}
.sh-f .btn{flex:1}
.fld{display:block;margin-top:12px}
.fld>span,.fld legend{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:5px;padding:0}
fieldset.fld{border:0;padding:0;margin-inline:0}
input[type=text],input[type=date],input[type=time],input[type=number],input:not([type]),select,textarea{width:100%;font-size:16px;min-height:48px;padding:10px 13px;border-radius:10px;border:0;background:var(--raise);box-shadow:inset 0 0 0 1px var(--line2);color:var(--text)}
textarea{min-height:72px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fld{min-width:0}
.radios{display:flex;flex-wrap:wrap;gap:0 6px}
.radios label{position:relative;display:inline-flex;align-items:center;min-height:44px}
.radios input{position:absolute;opacity:0;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.radios span{min-height:38px;display:inline-flex;align-items:center;gap:6px;padding:0 13px;border-radius:19px;background:var(--raise);box-shadow:inset 0 0 0 1px var(--line2);font-weight:600;font-size:14.5px}
.radios input:checked+span{background:var(--text);color:var(--bg);box-shadow:none}
.radios input:focus-visible+span{outline:2.5px solid var(--accent);outline-offset:2px}
.radios.icons span{width:40px;height:40px;padding:0;justify-content:center;border-radius:11px}
.radios.icons{gap:0 2px}
.radios.icons label{min-width:44px;justify-content:center}
.kinds{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);border-radius:11px;padding:4px;margin:6px 0 4px}
.kinds button{min-height:44px;border-radius:8px;font-weight:600;font-size:14.5px;color:var(--soft);text-align:center}
.kinds button[aria-pressed="true"]{background:var(--raise);color:var(--text);box-shadow:var(--shadow)}
.quick{display:flex;gap:2px 6px;margin-top:4px;flex-wrap:wrap}
.quick button{min-height:44px;padding:0 4px;font-size:14px;font-weight:600;color:var(--ink);position:relative}
.quick button span{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:17px;background:var(--sunk);color:var(--soft)}
.hpick{display:grid;gap:8px;margin-top:10px}
.hpick button{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;min-height:56px;padding:8px 14px 8px 8px;border-radius:12px;background:var(--raise);box-shadow:var(--shadow);text-align:left;font-weight:600}

/* toast */
.toast{position:fixed;z-index:70;left:50%;bottom:calc(var(--tabh) + 82px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);border-radius:12px;padding:4px 4px 4px 16px;display:flex;align-items:center;gap:8px;max-width:min(92vw,460px);width:max-content;box-shadow:var(--pop);transition:.2s;font-weight:600;font-size:14.5px}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{min-height:44px;padding:0 12px;border-radius:9px;color:var(--tbtn);font-weight:700}
.toast:not(:has(button)){padding-right:16px;min-height:48px}

/* ---------- folds: a secondary section's header doubles as its live one-line summary ---------- */
.fold>.sec-h{min-height:44px;padding:0}
.fold .sec-t{flex:1;min-width:0}
.fold-b{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 2px;text-align:left;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;border-radius:8px}
.fold-b .fold-t{flex:none}
.fold-s{flex:1;min-width:0;font:400 13px/1.2 var(--sans);letter-spacing:0;text-transform:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold-s b{font-weight:600;color:var(--soft)}
.fold-b>svg.i{--s:18px;margin-left:auto;color:var(--muted);transition:transform .18s}
.fold-b[aria-expanded="false"]>svg.i{transform:rotate(-90deg)}
.fold-body[hidden]{display:none}
.fold.shut>.sec-h{box-shadow:inset 0 -1px 0 var(--line);margin-bottom:0}
.fold.shut+.fold.shut{margin-top:0}
.disc{display:flex;align-items:center;gap:4px;width:100%;min-height:44px;padding:0 2px;color:var(--ink);font-weight:600;font-size:14px;box-shadow:inset 0 1px 0 var(--line)}

/* habit chips: tap logs a session; sage when the week's target is met, orange ring when behind the floor */
.hchips{display:flex;flex-wrap:wrap;gap:0 6px}
.hchip{min-height:44px;display:inline-flex;align-items:center}
.hchip>span{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 5px 0 10px;border-radius:17px;background:var(--raise);box-shadow:inset 0 0 0 1px var(--line2);font-size:13.5px;font-weight:600;white-space:nowrap}
.hchip svg.i{--s:15px;color:var(--muted)}
.hchip .ct{color:var(--muted)}
.hchip .pl{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--hot);color:var(--ink)}
.hchip .pl svg.i{--s:14px;color:var(--ink);stroke-width:2.4}
.hchip.met>span{background:color-mix(in srgb,var(--good) 13%,var(--raise));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 60%,transparent)}
.hchip.met .ct,.hl li.met .hc{color:var(--good)}
.hchip.low>span{box-shadow:inset 0 0 0 1.5px var(--accent)}
.hchip.low .ct{color:var(--ink)}
.hl li.met .logbtn span{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.hl li.low .logbtn span{box-shadow:inset 0 0 0 1.5px var(--accent)}

/* ---------- display popover: theme + density ---------- */
.pop{position:fixed;z-index:66;width:264px;max-width:calc(100vw - 24px);background:var(--raise);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--pop);padding:6px 12px 12px}
.pop[hidden]{display:none}
.pop-l{margin:8px 0 2px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
.pop .kinds{margin:4px 0 0}
.pop .kinds button{font-size:14px}
.pop-n{margin:6px 2px 0;font-size:12.5px;color:var(--muted)}

/* ---------- responsive (two-column layout lives in the final5 block below) ---------- */
@media (min-width:700px){
  :root{--gut:20px}
  .app>*{max-width:720px;margin-inline:auto}
  .bar-in{max-width:720px}
  .tabbar{left:50%;right:auto;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:500px;border-radius:22px;box-shadow:var(--pop);padding:0 6px}
  .fab{bottom:calc(var(--tabh) + 30px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(var(--tabh) + 100px)}
  .qgrid{grid-template-columns:repeat(4,1fr)}
  .sheet{bottom:auto;top:50%;border-radius:20px;transform:translateY(-40%) scale(.98);opacity:0;pointer-events:none;transition:.22s;max-height:86dvh}
  .sheet.open{transform:translateY(-50%);opacity:1;pointer-events:auto}
  .grab{display:none}
}
@media (min-width:1080px){
  :root{--gut:24px}
  .tabbar{top:0;bottom:0;left:0;transform:none;width:88px;border-radius:0;border:0;box-shadow:1px 0 0 var(--line);padding:calc(env(safe-area-inset-top) + 84px) 8px 0}
  .tabbar-in{grid-template-columns:1fr;gap:4px}
  .tab{min-height:68px;font-size:12.5px}
  .app{max-width:none;padding-left:calc(88px + 28px);padding-right:28px;padding-bottom:70px}
  .bar{padding-left:88px}
  .fab{bottom:28px;right:32px}
  .fab .lbl{display:inline}
  .toast{bottom:104px;left:calc(50% + 44px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
/* ================= calm layer (v1 default): roomy, one card style, few borders ================= */
body{font:400 16.5px/1.5 var(--sans)}
.app{max-width:720px;padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) calc(var(--tabh) + 110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{min-height:64px}
.iconbtn{color:var(--muted)}
.daystrip{display:block;margin:2px 0 4px;min-height:0;font-size:15px;color:var(--muted)}
.daystrip .d,.daystrip .hotc{font-weight:600}
.daystrip .sep{margin:0 4px}
.daystrip .hotc{color:var(--ink)}
.phead{margin:6px 0 10px}
.ltitle{font:600 clamp(26px,7vw,32px)/1.12 var(--display)}
.sec{margin-top:30px}
.flow>.sec:first-child,.split>.col>.sec:first-child{margin-top:12px}
.sec-h{position:static;background:none;min-height:40px;margin:0 0 6px;padding:0 2px}
.sec-t{font:600 13px/1 var(--sans);letter-spacing:.07em;color:var(--muted)}
.sec-t .tm{display:none}
.t1 .sec-t{color:var(--ink)}
.sec-t .ct{font-weight:400;font-size:14px}
.group-l{font-weight:600;color:var(--muted);margin:18px 2px 6px}
.card{background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:4px 14px}
.t1 .card,.t3 .card{background:var(--surface);box-shadow:var(--shadow);border:0}
.card.pad{padding:16px 10px}
.hcard,.goal{padding:16px}
.list>li+li.task::before{left:48px;background:var(--line);opacity:.7}
.task{column-gap:4px}
.tmain{padding:9px 0 8px}
.ttl{font-size:16.5px;line-height:1.35;font-weight:600}
.tmeta{font-size:13.5px;margin-top:2px;gap:2px 10px}
.tmeta .hot,.tmeta .bad{font-weight:600}
.task.late::after{left:-14px}
.ev{padding:10px 0}
.ev .et{font-size:16px;line-height:1.35}
.ev .es{font-size:13.5px}
.chip{font-weight:600}
.nowcard{margin-top:10px;background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:var(--r);padding:16px 18px 16px 22px}
.nowcard h3{font-size:clamp(22px,6vw,26px);margin:8px 0 4px}
.nowcard .why{font-size:15px}
.nowcard .acts{margin-top:12px;gap:8px}
.nowcard.clear{background:var(--surface)}
.btn{border-radius:12px}
/* folds: quiet rows */
.fold>.sec-h{min-height:48px}
.fold.shut>.sec-h{box-shadow:none;margin-bottom:0}
.fold.shut{margin-top:10px}
.fold.shut+.fold.shut{margin-top:2px}
.fold-s{font-size:14px}
.sec.z-amb>.sec-h{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:0 12px 0 14px}
.sec.z-amb .fold-b{min-height:48px}
.sec.z-amb:not(.shut)>.sec-h{border-radius:var(--r) var(--r) 0 0;box-shadow:none}
.sec.z-amb .fold-body{background:var(--surface);border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow);padding:2px 14px 14px;margin-top:-1px}
.sec.z-amb:not(.shut){box-shadow:var(--shadow);border-radius:var(--r);background:var(--surface)}
.sec.z-amb:not(.shut) .fold-body{box-shadow:none}
