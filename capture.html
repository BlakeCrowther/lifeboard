<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ecosystem capture</title>
<!-- The Ecosystem alone, filling the window, for QA capture (models/shared/tools/capture_ecosystem.mjs) and judging.
     Lives at the repo root so the scene finds models/roster.json and models/biomes.json exactly as the board does.
     Needs `pnpm build` (dist/capture.js, src/capture-page.ts). No board, no db: the game state is synthetic. Query: every ecosystem test hook (?inspect=, ?visitor=, ?biome=, ?phase=,
     ?hour=, ?weather=, ?month=) plus ?neglect=<0..1> (overdue blight + murk). -->
<style>
html,body{margin:0;height:100%;background:#0b3a5c;overflow:hidden}
.eco-card{position:fixed;inset:0}
.eco-card .sec-h,.hab-chips,.hab-info,.hab-fs,.hab-msg{display:none}
.hab{position:absolute;inset:0;background:#0b3a5c}
.hab canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="slot"></div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module" src="dist/capture.js"></script>
</body>
</html>
